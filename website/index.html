<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HoloSense</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0A0E17;
    --panel: #121a2c;
    --panel-2: #17203a;
    --border: #232c47;
    --border-strong: #34406b;
    --text-primary: #E7ECF7;
    --text-secondary: #90a0c2;
    --text-muted: #5b6889;
    --cyan: #52E6D2;
    --violet: #9B7BFF;
    --amber: #F2B94D;
    --danger: #F26D6D;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text-primary);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }

  body {
    background-image:
      radial-gradient(circle at 15% 10%, rgba(82,230,210,0.06), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(155,123,255,0.07), transparent 45%);
    display: flex;
    justify-content: center;
    padding: 48px 20px 80px;
  }

  .wrap {
    width: 100%;
    max-width: 900px;
  }

  header {
    display: flex;
    align-items: center;
    gap: 18px;
    margin-bottom: 44px;
  }

  .mark {
    width: 52px;
    height: 52px;
    flex-shrink: 0;
  }

  .brand-text h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 28px;
    letter-spacing: 0.5px;
    margin: 0;
  }
  .brand-text h1 span { color: var(--cyan); }

  .brand-text p {
    margin: 4px 0 0;
    color: var(--text-secondary);
    font-size: 14px;
  }

  .status-line {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 28px;
    font-size: 13px;
    color: var(--text-muted);
    font-family: 'Space Grotesk', sans-serif;
    letter-spacing: 0.3px;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--text-muted);
    box-shadow: 0 0 0 0 rgba(0,0,0,0);
    transition: background .3s, box-shadow .3s;
  }
  .status-dot.online {
    background: var(--cyan);
    box-shadow: 0 0 8px 1px rgba(82,230,210,0.6);
  }
  .status-dot.error { background: var(--danger); box-shadow: 0 0 8px 1px rgba(242,109,109,0.5); }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 18px;
  }
  @media (max-width: 640px) {
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 420px) {
    .grid { grid-template-columns: 1fr; }
  }
#stopBtn{
  padding:14px 40px;
  border:none;
  border-radius:12px;
  background:var(--danger);
  color:white;
  font-family:'Space Grotesk',sans-serif;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  transition:.2s;
}

#stopBtn:hover{
  transform:translateY(-2px);
}
  .card {
    position: relative;
    background: linear-gradient(180deg, var(--panel), var(--panel-2));
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 26px 18px 20px;
    cursor: pointer;
    text-align: center;
    transition: border-color .2s, transform .15s;
    overflow: hidden;
    user-select: none;
  }
  #sendBtn{
  padding:14px 40px;
  border:none;
  border-radius:12px;
  background:var(--cyan);
  color:#081019;
  font-family:'Space Grotesk',sans-serif;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  transition:.2s;
}

#sendBtn:hover:not(:disabled){
  transform:translateY(-2px);
}

#sendBtn:disabled{
  opacity:.45;
  cursor:not-allowed;
}
  .card:hover {
    border-color: var(--border-strong);
    transform: translateY(-2px);
  }
  .card:focus-visible {
    outline: 2px solid var(--cyan);
    outline-offset: 2px;
  }
  .card.selected {
    border-color: var(--cyan);
    box-shadow: 0 0 0 1px rgba(82,230,210,0.4), 0 0 24px rgba(82,230,210,0.18);
  }
  .card.sending { border-color: var(--amber); }

  .icon-ring {
    width: 80%;
    aspect-ratio: 1 / 1;
    margin: 0 auto 14px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon-ring img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 10px;
    position: relative;
    z-index: 2;
  }
  .icon-ring .ring {
    position: absolute;
    inset: -4px;
    border-radius: 12px;
    border: 1px solid var(--border-strong);
    transition: border-color .2s;
  }
  .card.selected .icon-ring .ring { border-color: var(--cyan); }

  .pulse {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1px solid var(--cyan);
    opacity: 0;
  }
  .card.sending .pulse {
    animation: pulse-out 0.9s ease-out;
  }
  @keyframes pulse-out {
    0% { opacity: 0.9; transform: scale(0.9); }
    100% { opacity: 0; transform: scale(2.1); }
  }

  .card h3 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px;
    font-weight: 500;
    margin: 0 0 8px;
    letter-spacing: 0.2px;
  }

  .value-chip {
    display: inline-block;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 12px;
    color: var(--text-secondary);
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    padding: 3px 10px;
    border-radius: 20px;
  }
  .card.selected .value-chip {
    color: var(--cyan);
    border-color: rgba(82,230,210,0.4);
  }

  .check {
    position: absolute;
    top: 10px;
    right: 12px;
    width: 18px;
    height: 18px;
    opacity: 0;
    transform: scale(0.6);
    transition: opacity .2s, transform .2s;
  }
  .card.selected .check { opacity: 1; transform: scale(1); }
  .check svg { stroke: var(--cyan); }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 32px;
    transform: translateX(-50%) translateY(20px);
    background: var(--panel-2);
    border: 1px solid var(--border-strong);
    color: var(--text-primary);
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 13px;
    font-family: 'Space Grotesk', sans-serif;
    display: flex;
    align-items: center;
    gap: 10px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s, transform .25s;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .toast.ok .dot { background: var(--cyan); }
  .toast.err .dot { background: var(--danger); }

  footer {
    margin-top: 40px;
    font-size: 12px;
    color: var(--text-muted);
    text-align: center;
    font-family: 'Space Grotesk', sans-serif;
  }
  footer code {
    color: var(--text-secondary);
    background: rgba(255,255,255,0.03);
    padding: 2px 6px;
    border-radius: 4px;
  }

  @media (prefers-reduced-motion: reduce) {
    .card, .pulse { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <svg class="mark" viewBox="0 0 52 52" fill="none">
      <circle cx="26" cy="26" r="24" stroke="#232c47" stroke-width="1.5"/>
      <circle cx="26" cy="26" r="16" stroke="#52E6D2" stroke-width="1.5" opacity="0.8"/>
      <circle cx="26" cy="26" r="4.5" fill="#9B7BFF"/>
    </svg>
    <div class="brand-text">
      <h1>Holo<span>Sense</span></h1>
      <p>Video command console</p>
    </div>
  </header>

  <div class="status-line">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">Connecting to HoloSense…</span>
  </div>

  <div class="grid" id="cardGrid" role="radiogroup" aria-label="Video commands"></div>


<div style="display:flex;justify-content:center;gap:15px;margin-top:30px;">
  <button id="sendBtn" disabled>Send Command</button>
  <button id="stopBtn">Stop</button>
</div>




  <footer>path <code>video_command/</code> — tap a card to send its value</footer>
</div>

<div class="toast" id="toast">
  <span class="dot"></span>
  <span id="toastText"></span>
</div>

<script type="module">
  // ---------------------------------------------------------------
  // 1) FIREBASE CONFIG — replace with your own project's config
  //    (Firebase console → Project settings → General → Your apps)
  // ---------------------------------------------------------------
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBe2oKj8MPW8et0Gfal8AAvOKTdXQL4jRk",
  authDomain: "holosense-1cf1c.firebaseapp.com",
  databaseURL: "https://holosense-1cf1c-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "holosense-1cf1c",
  storageBucket: "holosense-1cf1c.firebasestorage.app",
  messagingSenderId: "268882816018",
  appId: "1:268882816018:web:ca3e10b3d4ad5fdd4dbccb",
  measurementId: "G-0XDKSL4N35"
};

  let db = null;
  let firebaseReady = false;

  try {
    const app = initializeApp(firebaseConfig);
    db = getDatabase(app);
    firebaseReady = true;
    setStatus("online", "HoloSense ready");
  } catch (e) {
    setStatus("error", "Firebase not configured — edit firebaseConfig in index.html");
  }

  function setStatus(state, text) {
    const dot = document.getElementById('statusDot');
    const label = document.getElementById('statusText');
    dot.className = 'status-dot ' + (state === 'online' ? 'online' : state === 'error' ? 'error' : '');
    label.textContent = text;
  }

  // ---------------------------------------------------------------
  // 2) COMMAND CARDS — edit title / value / icon here
  // ---------------------------------------------------------------
  // Point each "image" at a file in the SAME FOLDER as this index.html
  // e.g. "play.png", "images/play.jpg", "./pause.svg" etc.
  const commands = [
    { id: 'coconut',    title: 'Coconut',    value:'coconut', image: 'coconut.png' },
    { id: 'orange',   title: 'Orange',   value: 'orange', image: 'orange.png' },
    { id: 'pineapple',    title: 'Pineapple',    value: 'pineapple', image: 'pineapple.png' },
    { id: 'strawberry',  title: 'Strawberry',  value:  'strawberry', image: 'strawberry.png' },
    { id: 'watermelon', title: 'Watermelon', value: 'watermelon', image: 'watermelon.png' }
  ];

  const grid = document.getElementById('cardGrid');
  let selectedId = null;
let selectedCommand = null;

  commands.forEach(cmd => {
    const card = document.createElement('div');
    card.className = 'card';
    card.setAttribute('role', 'radio');
    card.setAttribute('aria-checked', 'false');
    card.setAttribute('tabindex', '0');
    card.dataset.id = cmd.id;

    card.innerHTML = `
      <span class="pulse"></span>
      <span class="check"><svg viewBox="0 0 18 18" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5l3 3 7-7"/></svg></span>
      <div class="icon-ring"><span class="ring"></span><img src="${cmd.image}" alt="${cmd.title}" onerror="this.style.opacity=0;this.parentElement.style.background='rgba(255,255,255,0.03)';"></div>
      <h3>${cmd.title}</h3>
      <span class="value-chip">${cmd.value}</span>
    `;

    card.addEventListener('click', () => selectCommand(cmd, card));
    card.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        selectCommand(cmd, card);
      }
    });

    grid.appendChild(card);
  });

  function selectCommand(cmd, cardEl) {
  document.querySelectorAll('.card').forEach(c => {
    c.classList.remove('selected');
    c.setAttribute('aria-checked', 'false');
  });

  cardEl.classList.add('selected');
  cardEl.setAttribute('aria-checked', 'true');

  selectedId = cmd.id;
  selectedCommand = cmd;

  document.getElementById("sendBtn").disabled = false;
}

document.getElementById("sendBtn").addEventListener("click", async () => {

  if (!selectedCommand) return;

  if (!firebaseReady) {
    showToast("err", "Firebase not configured");
    return;
  }

  const cardEl = document.querySelector(`[data-id="${selectedCommand.id}"]`);

  // pulse animation
  void cardEl.offsetWidth;
  cardEl.classList.add("sending");
  setTimeout(() => cardEl.classList.remove("sending"), 900);

  try {
    await set(ref(db, "video_command"), selectedCommand.value);
    showToast("ok", `Sent "${selectedCommand.title}"`);
  } catch (err) {
    console.error(err);
    showToast("err", "Send failed");
  }
});

document.getElementById("stopBtn").addEventListener("click", async () => {

  if (!firebaseReady) {
    showToast("err", "Firebase not configured");
    return;
  }

  try {
    await set(ref(db, "video_command"), "stop");
    showToast("ok", 'Sent "stop"');
  } catch (err) {
    console.error(err);
    showToast("err", "Send failed");
  }

});

  let toastTimer = null;
  function showToast(type, text) {
    const toast = document.getElementById('toast');
    const toastText = document.getElementById('toastText');
    toast.className = 'toast show ' + type;
    toastText.textContent = text;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2600);
  }
</script>
</body>
</html>
